name: CI Pipeline

on:
  push:
    branches: ["main", "master", "phase-*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend Lint, Test & Spec Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finpilot_test
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: finpilot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run code formatting & linter checks
        run: |
          cd backend
          black --check .
          isort --check .
          flake8 .
          ruff check .

      - name: Check migrations completeness
        env:
          DJANGO_SECRET_KEY: test-ci-secret-key-at-least-50-characters-long-for-django
          JWT_SIGNING_SECRET_KEY: test-ci-jwt-secret-key-at-least-50-characters-long-for-simplejwt
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: finpilot_test
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: finpilot_test_password
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run test suite & coverage
        env:
          DJANGO_SECRET_KEY: test-ci-secret-key-at-least-50-characters-long-for-django
          JWT_SIGNING_SECRET_KEY: test-ci-jwt-secret-key-at-least-50-characters-long-for-simplejwt
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: finpilot_test
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: finpilot_test_password
        run: |
          cd backend
          python -m pytest apps/ --cov=apps --cov-fail-under=80

      - name: Validate OpenAPI schema generation
        env:
          DJANGO_SECRET_KEY: test-ci-secret-key-at-least-50-characters-long-for-django
          JWT_SIGNING_SECRET_KEY: test-ci-jwt-secret-key-at-least-50-characters-long-for-simplejwt
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: finpilot_test
          POSTGRES_USER: finpilot
          POSTGRES_PASSWORD: finpilot_test_password
        run: |
          cd backend
          python manage.py spectacular --file ../docs/api/openapi.yaml --validate

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install npm packages
        run: |
          cd frontend
          npm install

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build SPA
        run: |
          cd frontend
          npm run build

  security:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  docker:
    name: Docker Build & Readiness Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create local .env
        run: cp .env.example .env

      - name: Build & boot containers
        run: docker compose up --build -d

      - name: Poll Readiness Endpoint
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/health/ready/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health ready check passed (200 OK)!"
              exit 0
            fi
            echo "Waiting for services... status=$STATUS"
            sleep 2
          done
          echo "Health ready check timed out."
          docker compose logs
          exit 1

      - name: Cleanup
        run: docker compose down -v
